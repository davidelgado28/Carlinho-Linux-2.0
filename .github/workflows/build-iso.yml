name: Compilar ISO Linux x86_64

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código do Repositório
      uses: actions/checkout@v4

    - name: Instalar Ferramentas de Compilação
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev xorriso mtools cpio git wget dwarves

    - name: Baixar e Compilar Kernel Linux
      run: |
        set -e
        KERNEL_VERSION="6.6.21"
        wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz
        tar -xf linux-${KERNEL_VERSION}.tar.xz
        cd linux-${KERNEL_VERSION}
        
        make defconfig
        make -j$(nproc) bzImage
        
        mkdir -p ../build
        cp arch/x86/boot/bzImage ../build/vmlinuz

    - name: Criar RootFS com BusyBox e Wallpaper
      run: |
        set -e
        mkdir -p build/rootfs/{bin,sbin,dev,proc,sys,etc,mnt,root}
        
        # Copia o papel de parede
        mkdir -p build/rootfs/usr/share/backgrounds/
        cp assets/wallpaper.jpg build/rootfs/usr/share/backgrounds/wallpaper.jpg || true
        
        # Baixa o BusyBox
        wget -q https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox -O build/rootfs/bin/busybox
        chmod +x build/rootfs/bin/busybox
        
        cd build/rootfs/bin
        for tool in $(./busybox --list); do
          ln -s busybox $tool 2>/dev/null || true
        done
        cd ../../..

        cat << 'EOF' > build/rootfs/init
        #!/bin/sh
        mount -t proc none /proc
        mount -t sysfs none /sys
        clear
        echo "========================================"
        echo "   BEM-VINDO AO CARLINHO-LINUX (v1.0)   "
        echo "========================================"
        exec /bin/sh
        EOF
        chmod +x build/rootfs/init

    - name: Compactar Initramfs
      run: |
        set -e
        cd build/rootfs
        find . -print0 | cpio --null -ov --format=newc | gzip -9 > ../initramfs.img
        cd ../..

    - name: Gerar ISO Híbrida com Limine
      run: |
        set -e
        git clone https://github.com/limine-bootloader/limine.git --branch=v7.x-binary --depth=1
        make -C limine
        
        # Limpa e cria a estrutura limpa na raiz
        rm -rf iso_root
        mkdir -p iso_root
        
        # Copia o Kernel e o Initramfs DIRETAMENTE para a raiz da ISO
        cp build/vmlinuz iso_root/vmlinuz
        cp build/initramfs.img iso_root/initramfs.img
        
        # Copia os binários do Limine exigidos para boot
        cp limine/limine-bios.sys limine/limine-bios-cd.bin limine/limine-uefi-cd.bin iso_root/
        
        # Cria o limine.conf na raiz com caminhos simples
        echo "timeout: 3" > iso_root/limine.conf
        echo "" >> iso_root/limine.conf
        echo "/Carlinho-Linux (64-bit)" >> iso_root/limine.conf
        echo "    protocol: linux" >> iso_root/limine.conf
        echo "    kernel_path: boot():/vmlinuz" >> iso_root/limine.conf
        echo "    initrd_path: boot():/initramfs.img" >> iso_root/limine.conf

        # Gera a ISO Híbrida
        xorriso -as mkisofs -iso-level 3 \
          -b limine-bios-cd.bin \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          --efi-boot limine-uefi-cd.bin \
          -efi-boot-part --efi-boot-image --protective-msdos-label \
          iso_root -o Carlinho-Linux.iso

        ./limine/limine bios-install Carlinho-Linux.iso

        echo "ISO gerada com sucesso!"
        ls -lh Carlinho-Linux.iso

    - name: Disponibilizar ISO para Download
      uses: actions/upload-artifact@v4
      with:
        name: Carlinho-Linux
        path: Carlinho-Linux.iso
